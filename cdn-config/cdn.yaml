# Global CDN config for all Edge Delivery sites in this Cloud Manager program.
# Deployed by the Edge Delivery config pipeline from cdn-config/cdn.yaml.
kind: "CDN"
version: "1"

metadata:
  envTypes: ["prod"]

data:
  # ---------------------------------------------------------------
  # Redirects (evaluated before origin selectors)
  # ---------------------------------------------------------------
  redirects:
    rules:
      # Site: madridistas-platinum
      - name: redirect-platinum-madridistas-to-platinum-realmadrid
        when:
          reqProperty: domain
          equals: platinum.madridistas.com
        action:
          type: redirect
          status: 301
          location:
            join:
              format: "https://platinum.realmadrid.com%s"
              args:
                - reqProperty: url

      # Site: play-landing-captacion - root of join goes to the RM Play landing
      - name: redirect-join-root
        when:
          allOf:
            - reqProperty: domain
              equals: join.realmadrid.com
            - reqProperty: originalPath
              equals: /
        action:
          type: redirect
          status: 302
          location: /rmplay/

      # Site: play-landing-captacion - add the missing trailing slash, keep the query string
      # /rmplay -> /rmplay/   |   /rmplay/en?x=1 -> /rmplay/en/?x=1
      - name: redirect-join-trailing-slash
        when:
          allOf:
            - reqProperty: domain
              equals: join.realmadrid.com
            - reqProperty: originalPath
              matches: "^/rmplay(/en)?$"
        action:
          type: redirect
          status: 301
          location:
            reqProperty: url
            transform:
              - op: replace
                match: '^/rmplay(/en)?(\?.*)?$'
                replacement: '/rmplay\1/\2'

  # ---------------------------------------------------------------
  # Path-based routing on join.realmadrid.com
  # Anything not matched goes to the site join is mapped to (community).
  # ---------------------------------------------------------------
  originSelectors:
    rules:
      # Site: play-landing-captacion
      - name: route-join-rmplay
        when:
          allOf:
            - reqProperty: domain
              equals: join.realmadrid.com
            - reqProperty: originalPath
              matches: "^/rmplay(/.*)?$"
        action:
          type: selectOrigin
          originName: rmplay

      # Site: play-landing-captacion - join's robots.txt and sitemap.xml
      # (otherwise the community site's "Disallow: /" would be served on join)
      - name: route-join-seo-files
        when:
          allOf:
            - reqProperty: domain
              equals: join.realmadrid.com
            - reqProperty: originalPath
              matches: "^/(robots\\.txt|sitemap\\.xml)$"
        action:
          type: selectOrigin
          originName: rmplay

      # Site: mad-rmworld-signup
      - name: route-join-rmworld
        when:
          allOf:
            - reqProperty: domain
              equals: join.realmadrid.com
            - reqProperty: originalPath
              matches: "^/rmworld(/.*)?$"
        action:
          type: selectOrigin
          originName: rmworld

    origins:
      - name: rmplay
        domain: main--play-landing-captacion--eds-realmadrid.aem.live
      - name: rmworld
        domain: main--mad-rmworld-signup--eds-realmadrid.aem.live
